<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shopping Website</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>ShopHub</h1>
                <p>Your Premium Shopping Destination</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-group checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="login-button">Sign In</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="#signup" class="toggle-signup">Create one</a></p>
                <p><a href="../index.html" class="back-link">← Back to Home</a></p>
            </div>
        </div>

        <!-- Signup Form -->
        <div class="signup-box" id="signupBox" style="display: none;">
            <div class="login-header">
                <h1>Join ShopHub</h1>
                <p>Create Your Account</p>
            </div>
            
            <form id="signupForm" class="login-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm" placeholder="Confirm password" required>
                </div>

                <button type="submit" class="login-button">Create Account</button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="#login" class="toggle-login">Sign in</a></p>
                <p><a href="../index.html" class="back-link">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="../scripts/login.js"></script>
</body>
</html>
